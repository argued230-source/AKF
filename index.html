<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AKF | سامانه مدیریت و پرونده دانش‌آموزان</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');

:root{
  --bg:#FAF6EC;
  --paper:#FFFFFF;
  --ink:#1B2A4A;
  --ink-soft:#4A5776;
  --seal:#A63A3A;
  --seal-dark:#7E2B2B;
  --gold:#C9971F;
  --line:#D8CFB8;
  --green:#3E7A4F;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Vazirmatn',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);
  background-image:
    linear-gradient(var(--line) 1px, transparent 1px);
  background-size: 100% 42px;
}
#app{max-width:1000px;margin:0 auto;padding:18px 14px 60px;}
h1,h2,h3{font-weight:800;margin:0 0 6px;}
p{line-height:1.9;color:var(--ink-soft);margin:0 0 10px;}
button{font-family:inherit;cursor:pointer;border:none;border-radius:10px;padding:11px 18px;font-size:15px;font-weight:600;transition:.15s;}
button.primary{background:var(--ink);color:#fff;}
button.primary:hover{background:#243662;}
button.seal{background:var(--seal);color:#fff;}
button.seal:hover{background:var(--seal-dark);}
button.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);}
button.ghost:hover{border-color:var(--ink);}
button.gold{background:var(--gold);color:#fff;}
button:disabled{opacity:.5;cursor:not-allowed;}
input,select,textarea{font-family:inherit;font-size:15px;padding:10px 12px;border:1.5px solid var(--line);
  border-radius:8px;background:#fff;color:var(--ink);width:100%;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink);}
label{display:block;font-size:13px;color:var(--ink-soft);margin:10px 0 4px;font-weight:600;}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px;
  box-shadow:0 1px 0 rgba(27,42,74,.04);}
.center-screen{min-height:80vh;display:flex;align-items:center;justify-content:center;}
.gate-card{max-width:380px;width:100%;text-align:center;}
.brand{font-size:34px;font-weight:800;letter-spacing:2px;color:var(--seal);margin-bottom:2px;}
.brand-sub{font-size:13px;color:var(--ink-soft);margin-bottom:22px;}
.row{display:flex;gap:10px;flex-wrap:wrap;}
.row > *{flex:1;min-width:120px;}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;
  border-bottom:2px solid var(--ink);}
.topbar .who{font-size:13px;color:var(--ink-soft);}
.tag{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:3px 12px;
  font-size:12px;font-weight:600;margin-left:6px;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:520px){.grid{grid-template-columns:1fr;}}
.class-card{cursor:pointer;}
.class-card:hover{border-color:var(--ink);}
.student-row{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;
  border-bottom:1px solid var(--line);cursor:pointer;}
.student-row:hover{background:#F5F0E2;}
.student-row:last-child{border-bottom:none;}
.stamp{width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  color:#fff;font-size:14px;font-weight:800;
  box-shadow:0 0 0 2px rgba(255,255,255,.75), 0 0 0 3px rgba(0,0,0,.08), 0 3px 6px rgba(27,42,74,.28),
    inset 0 2px 3px rgba(255,255,255,.35), inset 0 -3px 5px rgba(0,0,0,.25);
  text-shadow:0 1px 1px rgba(0,0,0,.3);}
.stamp.small{width:24px;height:24px;font-size:10px;}
.stamp-row{display:flex;gap:6px;align-items:center;}
.palette{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px;}
.swatch{width:32px;height:32px;border-radius:50%;padding:0;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1);}
.swatch.selected{border-color:var(--ink);transform:scale(1.12);}
.shape-btn{width:36px;height:36px;padding:0;border-radius:8px;background:#fff;border:1.5px solid var(--line);
  font-size:16px;color:var(--ink);}
.shape-btn.selected{border-color:var(--seal);background:var(--bg);color:var(--seal);}
.stamp-preview{margin-top:10px;display:flex;align-items:center;gap:8px;}
.ai-badge{display:inline-flex;align-items:center;gap:5px;background:linear-gradient(135deg,var(--gold),#e0b34a);
  color:#fff;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700;}
.comment{border-right:3px solid var(--line);padding:8px 12px;margin-bottom:8px;background:#FDFBF5;border-radius:6px;}
.comment .meta{font-size:12px;color:var(--ink-soft);margin-bottom:4px;display:flex;align-items:center;gap:6px;}
.tabbar{display:flex;gap:6px;margin-bottom:14px;border-bottom:1.5px solid var(--line);}
.tabbar button{background:transparent;border-radius:8px 8px 0 0;color:var(--ink-soft);padding:9px 16px;}
.tabbar button.active{color:var(--ink);border-bottom:2.5px solid var(--seal);margin-bottom:-1.5px;}
.modal-bg{position:fixed;inset:0;background:rgba(27,42,74,.45);display:flex;align-items:flex-end;justify-content:center;
  z-index:50;}
@media(min-width:640px){.modal-bg{align-items:center;}}
.modal{background:var(--paper);border-radius:16px 16px 0 0;max-width:600px;width:100%;max-height:88vh;overflow:auto;
  padding:20px;}
@media(min-width:640px){.modal{border-radius:16px;}}
.close-x{float:left;background:none;color:var(--ink-soft);font-size:20px;padding:2px 8px;}
.subtle{font-size:13px;color:var(--ink-soft);}
.badge-honor{display:inline-block;background:var(--bg);border:1px solid var(--gold);color:#8a6a12;
  padding:3px 10px;border-radius:20px;font-size:12px;margin:2px 3px 2px 0;}
table{width:100%;border-collapse:collapse;font-size:14px;}
th,td{padding:7px 6px;text-align:center;border-bottom:1px solid var(--line);}
th{color:var(--ink-soft);font-weight:600;}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:10px 20px;border-radius:10px;font-size:14px;z-index:100;}
.loader{display:inline-block;width:16px;height:16px;border:2.5px solid #fff;border-top-color:transparent;
  border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.err{color:var(--seal);font-size:13px;margin-top:6px;}
.chip-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;
  display:flex;align-items:center;gap:6px;}
.chip button{padding:0 4px;background:none;color:var(--seal);font-size:14px;}
a.linklike{color:var(--ink);text-decoration:underline;cursor:pointer;font-size:13px;}
.offline-bar{position:fixed;top:0;left:0;right:0;background:var(--seal);color:#fff;text-align:center;
  font-size:13px;padding:6px;z-index:200;}
</style>
</head>
<body>
<div id="app"></div>

<!-- Global safety net: this app is used all year by many teachers/students on
     school wifi — an unexpected error must never leave a blank white screen. -->
<script>
window.addEventListener('error', function(e){
  console.error('Uncaught error:', e.error || e.message);
});
window.addEventListener('unhandledrejection', function(e){
  console.error('Unhandled promise rejection:', e.reason);
});
</script>

<!-- Firebase (compat SDK — simplest to use from a single static HTML file, no build step) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" onerror="window.__fbLoadFailed=true"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js" onerror="window.__fbLoadFailed=true"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js" onerror="window.__fbLoadFailed=true"></script>
<script>
// ============================================================================
// FIREBASE SETUP — this project belongs only to this school. All data lives in
// your own Firestore database, isolated from anything else, protected by
// firestore.rules (see the separate rules file) that only lets signed-in
// teachers/admin of THIS school read or write anything.
// ============================================================================

// If any of the three CDN scripts above failed to load (blocked network,
// offline, ad-blocker, DNS issue at school, etc.) `firebase` will not exist.
// Instead of crashing with a blank white page, show a clear Persian message
// with a retry button — this app runs for a full school year, so it must
// fail gracefully rather than break silently for a non-technical teacher.
if (typeof firebase === 'undefined' || window.__fbLoadFailed) {
  document.getElementById('app').innerHTML = `
    <div style="min-height:80vh;display:flex;align-items:center;justify-content:center;padding:20px;">
      <div style="max-width:420px;text-align:center;font-family:Tahoma,Arial,sans-serif;">
        <div style="font-size:40px;margin-bottom:10px;">⚠️</div>
        <h2 style="margin:0 0 10px;color:#A63A3A;">اتصال به سرور برقرار نشد</h2>
        <p style="color:#4A5776;line-height:1.9;margin:0 0 18px;">
          کتابخانه‌ی Firebase بارگذاری نشد. لطفاً اتصال اینترنت را بررسی کنید
          (یا اگر در شبکه‌ی مدرسه هستید، مطمئن شوید آدرس gstatic.com مسدود نیست)
          و دوباره تلاش کنید.
        </p>
        <button onclick="location.reload()" style="font-family:inherit;cursor:pointer;border:none;border-radius:10px;
          padding:11px 22px;font-size:15px;font-weight:600;background:#1B2A4A;color:#fff;">
          تلاش مجدد
        </button>
      </div>
    </div>`;
  window.__fbInitFailed = true;
}

const firebaseConfig = window.__fbInitFailed ? null : {
  apiKey: "AIzaSyBU9mYR4hhg21MEXkIjfFBvxK4aNGZykgU",
  authDomain: "wapk-47cdd.firebaseapp.com",
  projectId: "wapk-47cdd",
  storageBucket: "wapk-47cdd.firebasestorage.app",
  messagingSenderId: "19532838167",
  appId: "1:19532838167:web:7f0ec160b9d8164ffab352"
};
let auth, db;
if (!window.__fbInitFailed) {
  firebase.initializeApp(firebaseConfig);
  auth = firebase.auth();
  db = firebase.firestore();
  db.enablePersistence({synchronizeTabs:true}).catch(()=>{}); // offline cache: keeps working (read-only) if wifi drops briefly
  // Force LOCAL persistence explicitly instead of relying on the SDK default —
  // some Firebase JS SDK versions/browsers don't reliably fall back to LOCAL
  // on their own, which was causing the login screen to reappear on every visit.
  auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch((e)=>{
    console.error('auth persistence setup failed:', e.code, e.message);
  });
}

// The one admin account for this school. Create this exact user, with a
// password only you know, in: Firebase Console → Authentication → Users → Add user.
const ADMIN_EMAIL = 'admin@akf-school.local';

// Teachers log in with just their name, never an email. Firebase Auth still needs
// an email internally, so we derive a stable, unguessable one from the teacher's
// name (same name -> always the same email, but you can't reverse it to get the name).
async function nameToEmail(name){
  const enc = new TextEncoder().encode(name.trim().toLowerCase());
  const buf = await crypto.subtle.digest('SHA-256', enc);
  const hex = Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,24);
  return `t-${hex}@akf-school.local`;
}

<script>
const STAMP_COLORS = [
  '#A63A3A','#7E2B2B','#D65D5D','#E0895A','#B5652E','#C9971F','#DDB84A',
  '#8E8A2E','#3E7A4F','#4A6741','#2F8F6B','#1E6E6E','#2F5D7C','#3B7FB0',
  '#1B2A4A','#3A4E9C','#5B4FA8','#8A4FA8','#A854C9','#B3477A','#7C3F58',
  '#C9527A','#5B4636','#8A6A4A','#4A5776','#1B2A4A','#6B2E3A','#2E6B5E',
  '#9C5B2E','#4A2E6B'
];
const STAMP_SHAPES = ['◆','●','■','✦','◈','▲','✚','❖','◉','★','▼','⬟','⬢','✪','❋','☘','⬥','✤','◐','☆'];
// 30 colors × 20 shapes = 600 unique stamp designs
const SUBJECTS = ['ادبیات فارسی','عربی','دینی و قرآن','ریاضی','علوم تجربی','مطالعات اجتماعی',
  'زبان انگلیسی','هنر','تربیت‌بدنی','کار و فناوری','آمادگی دفاعی','تفکر و سبک زندگی','مشاوره و راهنما'];

function teacherLabel(teacher, cls){
  const subject = teacher.subjects && teacher.subjects[cls];
  return subject ? `${teacher.name} — معلم ${subject}` : teacher.name;
}

let state = {
  screen:'loading', // loading | login | claimPassword | identity | classPicker | app
  identity:null,    // {role:'admin'|'teacher', name, teacherId, classes, activeClass}
  classes:[], students:{}, teachers:{}, comments:[], aiSuggestions:{},
  tab:'dashboard',
  selectedClass:null,
  selectedStudentId:null,
  toast:null,
  online:true
};

function uid(){ return Math.random().toString(36).slice(2,10); }

// escape any user-typed text before it goes into innerHTML (student/teacher names,
// comments, activities/projects/honors, class names, grade term names, etc.) —
// otherwise a name or comment containing HTML/script runs for every teacher who views it
function esc(str){
  return String(str==null?'':str).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function showToast(msg){
  state.toast = msg;
  render();
  setTimeout(()=>{ state.toast = null; render(); }, 2200);
}

window.addEventListener('online', ()=>{ state.online=true; render(); });
window.addEventListener('offline', ()=>{ state.online=false; render(); });

// ---------- Firestore helpers (each write is its own document, so two teachers
// editing different students/subjects at the same time never overwrite each other) ----------
async function fSave(col, id, data){
  try{ await db.collection(col).doc(id).set(data, {merge:false}); return true; }
  catch(e){ console.error('save failed', col, id, e); showToast('ذخیره نشد — اتصال را بررسی کنید و دوباره تلاش کنید.'); return false; }
}
async function fDelete(col, id){
  try{ await db.collection(col).doc(id).delete(); return true; }
  catch(e){ console.error('delete failed', col, id, e); showToast('حذف انجام نشد — دوباره تلاش کنید.'); return false; }
}

async function saveClasses(){ await fSave('meta', 'config', {classes: state.classes}); }
async function saveTeacher(t){ state.teachers[t.id]=t; await fSave('teachers', t.id, t); }
async function saveStudent(s){ state.students[s.id]=s; await fSave('students', s.id, s); }
async function deleteStudentRecord(id){ delete state.students[id]; await fDelete('students', id); }
async function deleteTeacherRecord(id){ delete state.teachers[id]; await fDelete('teachers', id); }
async function saveComment(c){ await fSave('comments', c.id, c); }
async function deleteCommentRecord(id){ await fDelete('comments', id); }
async function saveAIForClass(cls, data){ state.aiSuggestions[cls]=data; await fSave('ai', cls, data); }
async function deleteAIForClass(cls){ delete state.aiSuggestions[cls]; await fDelete('ai', cls); }
async function savePendingTeacher(p){ await fSave('pendingTeachers', p.id, p); }
async function deletePendingTeacher(id){ await fDelete('pendingTeachers', id); }

// ---------- live sync: once signed in, keep state updated in real time from Firestore.
// This means if colleague A adds a comment, colleague B's screen updates automatically
// without a reload, and nothing ever silently overwrites someone else's save. ----------
let unsubscribers = [];
function stopListening(){ unsubscribers.forEach(u=>u()); unsubscribers=[]; }

function startListening(){
  stopListening();
  stopPublicListening(); // once we're loading the authenticated data, the public (pre-login) listeners are redundant
  unsubscribers.push(db.collection('meta').doc('config').onSnapshot(doc=>{
    state.classes = (doc.exists && doc.data().classes) || [];
    render();
  }, e=>console.error('classes listener', e)));

  unsubscribers.push(db.collection('teachers').onSnapshot(snap=>{
    const map = {};
    snap.forEach(doc=>{ map[doc.id] = doc.data(); });
    state.teachers = map;
    normalizeData();
    render();
  }, e=>console.error('teachers listener', e)));

  unsubscribers.push(db.collection('students').onSnapshot(snap=>{
    const map = {};
    snap.forEach(doc=>{ map[doc.id] = doc.data(); });
    state.students = map;
    normalizeData();
    render();
  }, e=>console.error('students listener', e)));

  unsubscribers.push(db.collection('comments').onSnapshot(snap=>{
    state.comments = snap.docs.map(d=>d.data());
    render();
  }, e=>console.error('comments listener', e)));

  unsubscribers.push(db.collection('ai').onSnapshot(snap=>{
    const map = {};
    snap.forEach(doc=>{ map[doc.id] = doc.data(); });
    state.aiSuggestions = map;
    render();
  }, e=>console.error('ai listener', e)));
}

// public (no login required) listeners, so the login/registration screens can show
// existing classes & teacher stamps before anyone has signed in
let publicUnsubscribers = [];
function stopPublicListening(){ publicUnsubscribers.forEach(u=>u()); publicUnsubscribers=[]; }
function startPublicListening(){
  stopPublicListening(); // idempotent — safe to call even if already listening, never doubles up
  publicUnsubscribers.push(db.collection('meta').doc('config').onSnapshot(doc=>{
    state.classes = (doc.exists && doc.data().classes) || [];
    render();
  }));
  publicUnsubscribers.push(db.collection('teachers').onSnapshot(snap=>{
    const map = {};
    snap.forEach(doc=>{ map[doc.id] = doc.data(); });
    state.teachers = map;
    normalizeData();
    render();
  }));
}

function normalizeData(){
  Object.values(state.teachers).forEach(t=>{
    if(!t.classes) t.classes = [];
    if(!t.subjects) t.subjects = {};
  });
  Object.values(state.students).forEach(s=>{
    ['activities','projects','honors'].forEach(field=>{
      if(!s[field] || typeof s[field] !== 'object') s[field] = {};
    });
  });
  if(state.identity && state.identity.role==='teacher'){
    const t = state.teachers[state.identity.teacherId];
    if(t){
      state.identity.classes = t.classes;
      if(!state.identity.activeClass) state.identity.activeClass = t.classes[0] || null;
    }
  }
}

// ---------- boot: Firebase Auth remembers the session automatically across
// visits — no custom "identity" storage needed anymore. ----------
if (!window.__fbInitFailed) {
startPublicListening();
auth.onAuthStateChanged(async (user)=>{
  if(!user){
    state.identity = null;
    stopListening();
    startPublicListening(); // back at the login screen — restore the pre-login listeners so it can show classes/stamps again
    state.screen = 'login';
    render();
    return;
  }
  if(user.email === ADMIN_EMAIL){
    state.identity = {role:'admin', name:'مدیر مدرسه'};
    startListening();
    state.screen = 'app';
    render();
    return;
  }
  // teacher: their profile MUST exist at teachers/{uid}, or this session is invalid
  try{
    const doc = await db.collection('teachers').doc(user.uid).get();
    if(!doc.exists){
      await auth.signOut();
      showToast('حساب شما یافت نشد. با مدیر مدرسه تماس بگیرید.');
      return;
    }
    const t = doc.data();
    state.identity = {name:t.name, role:'teacher', teacherId:user.uid, classes:t.classes, activeClass:t.classes[0]||null};
    startListening();
    state.screen = 'classPicker';
    render();
  }catch(e){
    console.error('teacher profile load failed', e);
    showToast('اتصال برقرار نشد. اتصال اینترنت را بررسی کنید.');
  }
});
}

// ---------- login ----------
function switchLoginMode(mode){
  state._loginMode = mode; // 'admin' | 'teacher'
  state._loginErr = '';
  state._adminSetupOffer = false;
  render();
}
// A hardcoded admin password used to live here and get checked before ever
// touching Firebase Auth — anyone using "View Source" could read it, and worse,
// using it never actually signed in, so Firestore reads/writes silently failed
// once real security rules were added. Removed. Admin now always goes through
// real Firebase Auth (auth.signInWithEmailAndPassword), same as teachers.
async function submitAdminLogin(){
  const pw = document.getElementById('login-admin-pw').value;
  const btn = document.getElementById('admin-login-btn');
  btn.disabled = true;
  document.getElementById('login-err').textContent = '';
  try{
    await auth.signInWithEmailAndPassword(ADMIN_EMAIL, pw);
  }catch(e){
    console.error('admin login failed:', e.code, e.message);
    // Only offer "create admin account" for errors that genuinely mean the
    // account doesn't exist yet. Any other error (wrong password, disabled
    // sign-in method, unauthorized domain, network issue, etc.) must show
    // as a real error instead — otherwise clicking "create account" just
    // repeats the same underlying failure forever.
    const notFoundCodes = ['auth/user-not-found'];
    if(notFoundCodes.includes(e.code)){
      state._adminSetupOffer = pw;
    } else if(e.code === 'auth/invalid-credential' || e.code === 'auth/wrong-password'){
      document.getElementById('login-err').textContent = 'رمز اشتباه است، یا اگر اولین‌بار است، این خطا یعنی هنوز حساب مدیر ساخته نشده — با ادمین فنی تماس بگیرید.';
    } else if(e.code === 'auth/unauthorized-domain'){
      document.getElementById('login-err').textContent = 'این آدرس سایت در Firebase مجاز نشده (Authorized domains). با سازنده‌ی سایت تماس بگیرید.';
    } else if(e.code === 'auth/operation-not-allowed'){
      document.getElementById('login-err').textContent = 'روش ورود با رمز عبور در Firebase فعال نیست. با سازنده‌ی سایت تماس بگیرید.';
    } else {
      document.getElementById('login-err').textContent = 'خطا: ' + e.code;
    }
    render();
  }
  btn.disabled = false;
}
async function setupAdminAccount(){
  const pw = state._adminSetupOffer;
  if(!pw || pw.length < 6){
    document.getElementById('login-err').textContent = 'رمز باید حداقل ۶ کاراکتر باشد.';
    return;
  }
  try{
    await auth.createUserWithEmailAndPassword(ADMIN_EMAIL, pw);
    // onAuthStateChanged takes it from here — admin is now signed in for real
  }catch(e){

async function submitTeacherLogin(){
  const name = document.getElementById('login-teacher-name').value.trim();
  const pw = document.getElementById('login-teacher-pw').value;
  if(!name){ document.getElementById('login-err').textContent = 'نام را وارد کنید.'; return; }
  const email = await nameToEmail(name);

  if(!pw){
    // no password typed yet — figure out whether this is a brand new teacher,
    // someone bulk-added by the admin who hasn't set a password yet, or an
    // existing teacher who just forgot to type their password.
    const pending = await db.collection('pendingTeachers').where('name','==',name).limit(1).get();
    if(!pending.empty){
      state._claimPendingDoc = {id: pending.docs[0].id, ...pending.docs[0].data()};
      state.screen = 'claimPassword';
      render();
      return;
    }
    const existing = Object.values(state.teachers).find(t=>t.name===name);
    if(!existing){
      state._pendingName = name;
      state.screen = 'identity';
      render();
      return;
    }
    document.getElementById('login-err').textContent = 'رمز را وارد کنید.';
    return;
  }

  const btn = document.getElementById('teacher-login-btn');
  btn.disabled = true;

  try{
    await auth.signInWithEmailAndPassword(email, pw);
  }catch(e){
    if(e.code === 'auth/user-not-found' || e.code === 'auth/invalid-credential'){
      const pending = await db.collection('pendingTeachers').where('name','==',name).limit(1).get();
      if(!pending.empty){
        state._claimPendingDoc = {id: pending.docs[0].id, ...pending.docs[0].data()};
        state.screen = 'claimPassword';
      } else {
        const existing = Object.values(state.teachers).find(t=>t.name===name);
        if(existing){
          document.getElementById('login-err').textContent = 'رمز اشتباه است.';
        } else {
          state._pendingName = name;
          state.screen = 'identity';
        }
      }
      render();
    } else {
      document.getElementById('login-err').textContent = 'رمز اشتباه است.';
    }
  }
  btn.disabled = false;
}

// ---------- AI stamp (fully internal, no external calls) ----------
function chipTotal(s, field){
  return Object.values(s[field]||{}).reduce((sum,arr)=>sum+(arr?arr.length:0), 0);
}
async function runAIStamp(cls){
  const studentsInClass = Object.values(state.students).filter(s=>s.class===cls);
  if(studentsInClass.length === 0){ showToast('دانش‌آموزی در این کلاس نیست.'); return; }

  const scored = studentsInClass.map(s=>{
    const vals = Object.values(s.grades).filter(v=>typeof v==='number' && v>0);
    const avg = vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : 0;
    const trend = vals.length>=2 ? vals[vals.length-1]-vals[0] : 0;
    const commentsCount = state.comments.filter(c=>c.studentId===s.id).length;
    const activitiesCount = chipTotal(s,'activities');
    const projectsCount = chipTotal(s,'projects');
    const honorsCount = chipTotal(s,'honors');
    const score = avg*3 + Math.max(0,trend)*2.5 + activitiesCount*1.5 + projectsCount*2 + honorsCount*3 + commentsCount*0.6;

    const reasons=[];
    if(avg>=17) reasons.push('میانگین نمرات بالا');
    else if(avg>=14) reasons.push('میانگین نمرات خوب');
    if(trend>0.5) reasons.push('روند صعودی نمرات');
    if(honorsCount>0) reasons.push('کسب افتخار');
    if(activitiesCount>0 || projectsCount>0) reasons.push('فعالیت و پروژه فعال');
    if(reasons.length===0) reasons.push('عملکرد پایدار در طول ترم‌ها');

    return {id:s.id, score, reason: reasons.slice(0,2).join(' و ')};
  });

  scored.sort((a,b)=>b.score-a.score);
  const aiData = {
    students: scored.slice(0,5).map(x=>({id:x.id, reason:x.reason})),
    date: new Date().toLocaleDateString('fa-IR')
  };
  await saveAIForClass(cls, aiData);
  showToast('رتبه‌بندی هوشمند داخلی به‌روزرسانی شد.');
  render();
}

// ---------- render helpers ----------
function stampEl(color, shape, size){
  return `<span class="stamp ${size==='small'?'small':''}" style="background:${color}">${shape}</span>`;
}

// grades is a plain object, so its keys follow *insertion* order — if a teacher
// types term names out of order (e.g. adds "ترم ۳" before "ترم ۲"), the raw
// object order would wrongly scramble the trend/chart. Sort by the number
// found inside each term name instead (supports Persian ۰-۹ and Latin 0-9);
// terms with no number keep their original relative order.
function persianDigitsToLatin(str){
  const map = {'۰':'0','۱':'1','۲':'2','۳':'3','۴':'4','۵':'5','۶':'6','۷':'7','۸':'8','۹':'9'};
  return String(str).replace(/[۰-۹]/g, d=>map[d]);
}
function sortedGradeEntries(grades){
  return Object.entries(grades)
    .filter(e=>typeof e[1]==='number')
    .map((e,i)=>({e, i, num:(persianDigitsToLatin(e[0]).match(/\d+/)||[])[0]}))
    .sort((a,b)=>{
      if(a.num!=null && b.num!=null) return Number(a.num)-Number(b.num);
      if(a.num!=null) return -1;
      if(b.num!=null) return 1;
      return a.i-b.i;
    })
    .map(x=>x.e);
}

function performanceChartSVG(grades){
  const entries = sortedGradeEntries(grades);
  if(entries.length===0) return '<p class="subtle">هنوز نمره‌ای ثبت نشده.</p>';

  const vals = entries.map(e=>e[1]);
  const avg = vals.reduce((a,b)=>a+b,0)/vals.length;
  const trend = vals.length>=2 ? vals[vals.length-1]-vals[0] : 0;
  const trendHtml = trend>0.4
    ? `<span style="color:var(--green);font-weight:700">▲ صعودی (${trend.toFixed(1)}+)</span>`
    : trend<-0.4
      ? `<span style="color:var(--seal);font-weight:700">▼ نزولی (${Math.abs(trend).toFixed(1)}-)</span>`
      : `<span style="color:var(--ink-soft);font-weight:700">■ ثابت</span>`;
  const gradeColor = v => v>=14 ? '#3E7A4F' : v>=10 ? '#C9971F' : '#A63A3A';

  const w=600,h=230,padL=36,padR=20,padT=32,padB=36;
  const max=20,min=0;
  const innerW = w-padL-padR, innerH = h-padT-padB;
  const stepX = entries.length>1 ? innerW/(entries.length-1) : 0;
  const pts = entries.map((e,i)=>{
    const x = entries.length>1 ? padL + i*stepX : padL + innerW/2;
    const y = padT + innerH - ((e[1]-min)/(max-min))*innerH;
    return [x,y];
  });

  let path = `M ${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for(let i=0;i<pts.length-1;i++){
    const [x0,y0]=pts[i], [x1,y1]=pts[i+1];
    const cx = (x0+x1)/2;
    path += ` C ${cx.toFixed(1)},${y0.toFixed(1)} ${cx.toFixed(1)},${y1.toFixed(1)} ${x1.toFixed(1)},${y1.toFixed(1)}`;
  }
  const areaPath = path + ` L ${pts[pts.length-1][0].toFixed(1)},${padT+innerH} L ${pts[0][0].toFixed(1)},${padT+innerH} Z`;
  const passY = padT + innerH - (10/max)*innerH;

  const gridLines = [0,5,10,15,20].map(v=>{
    const y = padT + innerH - (v/max)*innerH;
    return `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="#E5DEC9" stroke-width="1"/>
      <text x="${padL-8}" y="${y+3}" font-size="10" text-anchor="end" fill="#9AA3BB">${v}</text>`;
  }).join('');

  const dots = pts.map((p,i)=>{
    const c = gradeColor(entries[i][1]);
    return `
    <circle cx="${p[0]}" cy="${p[1]}" r="10" fill="${c}" opacity="0.14"/>
    <circle cx="${p[0]}" cy="${p[1]}" r="5" fill="#fff" stroke="${c}" stroke-width="2.6"/>
    <text x="${p[0]}" y="${p[1]-15}" font-size="12" font-weight="700" text-anchor="middle" fill="${c}">${entries[i][1]}</text>
    <text x="${p[0]}" y="${h-12}" font-size="10.5" text-anchor="middle" fill="#4A5776">${esc(entries[i][0])}</text>`;
  }).join('');

  return `
  <div class="row" style="margin:2px 0 10px;gap:18px;flex-wrap:wrap">
    <span class="subtle">میانگین: <b style="color:var(--ink)">${avg.toFixed(1)}</b> از ۲۰</span>
    <span class="subtle">روند: ${trendHtml}</span>

    <defs>
      <linearGradient id="akfAreaFill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#A63A3A" stop-opacity="0.28"/>
        <stop offset="100%" stop-color="#A63A3A" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="akfLine" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#7E2B2B"/>
        <stop offset="100%" stop-color="#C9971F"/>
      </linearGradient>
    </defs>
    ${gridLines}
    <line x1="${padL}" y1="${passY}" x2="${w-padR}" y2="${passY}" stroke="#C9971F" stroke-width="1.2" stroke-dasharray="4,4" opacity="0.6"/>
    <text x="${w-padR}" y="${passY-6}" font-size="9.5" text-anchor="end" fill="#C9971F">حد نصاب ۱۰</text>
    ${entries.length>1?`<path d="${areaPath}" fill="url(#akfAreaFill)" stroke="none"/>
    <path d="${path}" fill="none" stroke="url(#akfLine)" stroke-width="3" stroke-linecap="round"/>`:''}
    ${dots}
  </svg>`;
}

function render(){
  // Full re-render (innerHTML replace) normally steals focus from whatever
  // input/textarea the user is typing in, making it feel like the keyboard
  // "jumps" or drops characters. Remember what was focused (by id) and the
  // cursor/selection position, then restore it after the DOM is rebuilt.
  const active = document.activeElement;
  let focusId = null, selStart = null, selEnd = null;
  if(active && active.id && (active.tagName==='INPUT' || active.tagName==='TEXTAREA')){
    focusId = active.id;
    try{ selStart = active.selectionStart; selEnd = active.selectionEnd; }catch(_){}
  }

  try{
    const app = document.getElementById('app');
    const offline = state.online ? '' : '<div class="offline-bar">آفلاین — تغییرات پس از اتصال دوباره ذخیره می‌شوند</div>';
    if(state.screen==='loading'){ app.innerHTML = offline+'<div class="center-screen"><p>در حال بارگذاری…</p></div>'; }
    else if(state.screen==='login'){ app.innerHTML = offline+renderLogin(); }
    else if(state.screen==='claimPassword'){ app.innerHTML = offline+renderClaimPassword(); }
    else if(state.screen==='identity'){ app.innerHTML = offline+renderIdentity(); }
    else if(state.screen==='classPicker'){ app.innerHTML = offline+renderClassPicker(); }
    else { app.innerHTML = offline+renderApp(); }
  }catch(e){
    // A single bad render must never leave a teacher staring at a blank white
    // page mid-year — show a recoverable message instead of crashing silently.
    console.error('render failed', e);
    document.getElementById('app').innerHTML = `
      <div class="center-screen" style="text-align:center;padding:20px;">
        <p style="color:#A63A3A;font-weight:600;">مشکلی در نمایش صفحه پیش آمد.</p>
        <button class="primary" onclick="location.reload()">تلاش مجدد</button>
      </div>`;
    return;
  }

  if(focusId){
    const el = document.getElementById(focusId);
    if(el){
      el.focus({preventScroll:true});
      if(typeof selStart==='number' && el.setSelectionRange){
        try{ el.setSelectionRange(selStart, selEnd); }catch(_){}
      }
    }
  }
}

// ---------- bulk import ----------
async function submitBulkStudents(){
  const cls = document.getElementById('bulk-student-class').value;
  const raw = document.getElementById('bulk-student-names').value;
  state._bulkStudentClass = cls;
  state._bulkStudentText = raw;
  if(!cls){ state._bulkStudentLog = 'ابتدا یک کلاس انتخاب کنید.'; render(); return; }
  const names = raw.split('\n').map(n=>n.trim()).filter(Boolean);
  if(names.length===0){ state._bulkStudentLog = 'هیچ نامی وارد نشده.'; render(); return; }

  const btn = document.getElementById('bulk-student-btn');
  btn.disabled = true; btn.innerHTML = '<span class="loader"></span> در حال ذخیره…';

  const existingNames = new Set(Object.values(state.students).filter(s=>s.class===cls).map(s=>s.name));
  let added=0, skippedDup=0;
  const seenThisBatch = new Set();
  const toSave = [];
  names.forEach(name=>{
    if(existingNames.has(name) || seenThisBatch.has(name)){ skippedDup++; return; }
    seenThisBatch.add(name);
    const id = uid();
    toSave.push({ id, name, class: cls, grades:{'ترم ۱': 0}, activities:{}, projects:{}, honors:{} });
    added++;
  });

  try{
    // batched Firestore write — hundreds of students go in as a handful of batch commits,
    // not hundreds of separate round-trips
    const chunkSize = 450;
    for(let i=0;i<toSave.length;i+=chunkSize){
      const batch = db.batch();
      toSave.slice(i,i+chunkSize).forEach(s=>batch.set(db.collection('students').doc(s.id), s));
      await batch.commit();
    }
    state._bulkStudentLog = `${added} دانش‌آموز اضافه شد.${skippedDup?` (${skippedDup} مورد به‌دلیل نام تکراری رد شد)`:''}`;
    state._bulkStudentText = '';
    showToast(`${added} دانش‌آموز در «${cls}» ذخیره شد.`);
  }catch(e){
    console.error('bulk student save failed', e);
    state._bulkStudentLog = 'خطا در ذخیره‌سازی: ' + (e.code || e.message || 'اتصال برقرار نشد. دوباره تلاش کنید.');
  }
  render();
}

async function submitBulkTeachers(){
  const raw = document.getElementById('bulk-teacher-list').value;
  state._bulkTeacherText = raw;
  const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
  if(lines.length===0){ state._bulkTeacherLog = 'هیچ خطی وارد نشده.'; render(); return; }

  const btn = document.getElementById('bulk-teacher-btn');
  btn.disabled = true; btn.innerHTML = '<span class="loader"></span> در حال ذخیره…';

  const errors = [];
  let added=0, updated=0;
  const toSave = new Map(); // name -> pending-teacher object
  // tracks every color+shape combo already in use, INCLUDING ones just handed out
  // earlier in this same paste — otherwise two brand-new teachers added in one
  // batch could randomly get the exact same stamp
  const usedCombos = new Set(Object.values(state.teachers).map(t=>t.color+t.shape));

  lines.forEach((line, idx)=>{
    const parts = line.split('،').map(p=>p.trim()).length>1
      ? line.split('،').map(p=>p.trim())
      : line.split(',').map(p=>p.trim());
    if(parts.length<3 || !parts[0] || !parts[1] || !parts[2]){
      errors.push(`خط ${idx+1}: قالب نادرست — «نام، کلاس، درس» لازم است.`);
      return;
    }
    const [name, cls, subject] = parts;
    if(!state.classes.includes(cls)){
      errors.push(`خط ${idx+1}: کلاس «${cls}» وجود ندارد.`);
      return;
    }
    if(!SUBJECTS.includes(subject)){
      errors.push(`خط ${idx+1}: درس «${subject}» در فهرست دروس نیست.`);
      return;
    }

    const alreadyRegistered = Object.values(state.teachers).find(t=>t.name===name);
    if(alreadyRegistered){
      // teacher already has a real account — just add the class/subject to their profile
      if(!alreadyRegistered.classes.includes(cls)) alreadyRegistered.classes.push(cls);
      alreadyRegistered.subjects[cls] = subject;
      toSave.set('acct:'+alreadyRegistered.id, {kind:'account', teacher: alreadyRegistered});
      updated++;
      return;
    }

    let pending = toSave.get('pend:'+name);
    if(pending){
      if(!pending.data.classes.includes(cls)) pending.data.classes.push(cls);
      pending.data.subjects[cls] = subject;
      return;
    }
    let color, shape, tries=0;
    do{
      color = STAMP_COLORS[Math.floor(Math.random()*STAMP_COLORS.length)];
      shape = STAMP_SHAPES[Math.floor(Math.random()*STAMP_SHAPES.length)];
      tries++;
    } while(usedCombos.has(color+shape) && tries<600);
    usedCombos.add(color+shape);
    toSave.set('pend:'+name, {kind:'pending', data:{id:uid(), name, classes:[cls], color, shape, subjects:{[cls]:subject}}});
    added++;
  });

  try{
    for(const entry of toSave.values()){
      if(entry.kind==='account') await saveTeacher(entry.teacher);
      else await savePendingTeacher(entry.data);
    }
    let log = `${added} معلم جدید اضافه شد`;
    if(updated) log += `، ${updated} معلم موجود به‌روزرسانی شد`;
    log += '.';
    if(errors.length) log += `\n\n⚠ ${errors.length} خط رد شد:\n` + errors.join('\n');
    log += '\n\nمعلمان جدید باید یک‌بار با نام خودشان وارد سامانه شوند تا رمز عبور خودشان را بسازند.';
    state._bulkTeacherLog = log;
    state._bulkTeacherText = '';
    showToast(`${added+updated} مورد ذخیره شد.`);
  }catch(e){
    console.error('bulk teacher save failed', e);
    state._bulkTeacherLog = 'خطا در ذخیره‌سازی: ' + (e.code || e.message || 'اتصال برقرار نشد. دوباره تلاش کنید.');
  }
  render();
}

        <button class="close-x" onclick="closeModal()">✕</button>
        <h3>افزودن دانش‌آموز به ${esc(state._newStudentClass)}</h3>

        </div>
      </div>
    </div>`;
